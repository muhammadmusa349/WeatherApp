name: weather_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  provider: ^6.1.5+1
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7   # ✅ MOVED HERE
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/appicon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/appicon.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/images/appicon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/appicon.png"

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/appicon.png
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: scaleAspectFit

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/